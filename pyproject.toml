[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "sightcite"
version = "0.1.0"
description = "Evidence-grounded visual RAG for scientific papers."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "information-retrieval",
    "multimodal",
    "rag",
    "scientific-papers",
    "visual-question-answering",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
authors = [
    { name = "Sedjro Salomon Hotegni" },
]
dependencies = [
    "numpy>=1.26,<2.4",
    "PyMuPDF>=1.24,<2",
    "pytesseract>=0.3.13,<0.4",
    "sentence-transformers>=5.4,<6",
]

[project.scripts]
sightcite = "sightcite.cli:main"

[project.urls]
Homepage = "https://github.com/salomonhotegni/sightcite"
Repository = "https://github.com/salomonhotegni/sightcite"
Issues = "https://github.com/salomonhotegni/sightcite/issues"

[project.optional-dependencies]
langchain = [
    "langchain-core>=1.0,<2",
]
openai = [
    "openai>=2,<3",
    "pydantic>=2.10,<3",
]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.11",
]
release = [
    "build>=1.4,<2",
    "twine>=6.2,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=sightcite",
    "--cov-report=term-missing",
]
testpaths = ["tests"]
markers = [
    "model: tests that load or download machine-learning model weights",
    "ocr: tests that require the external Tesseract OCR executable",
    "openai: tests that make billable requests to the OpenAI API",
]

[tool.coverage.run]
branch = true
source = ["sightcite"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "RUF",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
